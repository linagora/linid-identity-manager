spring:
  application:
    name: LinId-Sync-API

  config:
    import: optional:file:${EXTERNAL_CONFIGURATION}

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # The migrations run with the administrator account, since the datasource account cannot create tables
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    user: ${DATABASE_ADMIN_USER}
    password: ${DATABASE_ADMIN_PASSWORD}

  batch:
    jdbc:
      # The Spring Batch tables are created by the Flyway migrations
      initialize-schema: never
    job:
      # Jobs are never started when the application starts
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8443
  ssl:
    key-store: ${SSL_KEY_STORE}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SSL_KEY_PASSWORD}
    key-password: ${SSL_KEY_PASSWORD}
    # Mutual TLS: Tomcat rejects during the handshake any client without a certificate signed by a trusted CA
    client-auth: need
    trust-store: ${SSL_CLIENT_TRUSTSTORE_PATH}
    trust-store-password: ${SSL_CLIENT_TRUSTSTORE_PASSWORD:${SSL_TRUSTSTORE_PASSWORD}}
    truststore:
      path: ${SSL_TRUSTSTORE_PATH}
      password: ${SSL_TRUSTSTORE_PASSWORD}

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}

linid:
  datasource:
    url: jdbc:postgresql://${LINID_DATABASE_HOST}:${LINID_DATABASE_PORT}/${LINID_DATABASE_NAME}
    username: ${LINID_DATABASE_USER}
    password: ${LINID_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: linid
      maximum-pool-size: ${LINID_DATABASE_MAX_POOL_SIZE:5}

sync:
  # Schedule of the global job, as a Spring cron expression (second, minute, hour, day of month, month, day of week)
  cron: "${SYNC_CRON:0 0 2 * * *}"
  # Subject of the only accepted client certificate, since the other components have certificates signed by the
  # same CA
  allowed-client: ${SYNC_ALLOWED_CLIENT}
  # act_id of the technical account of sync-api in the linid-api database, shared by its instances and recorded as
  # the author of their writes
  technical-account-id: ${SYNC_TECHNICAL_ACCOUNT_ID}

opa:
  # OPA server, on which linid-api deploys the policies of the applications
  server-url: ${OPA_SERVER_URL:http://opa:8181}
  # Path of the result of an application policy, {code} being the application code
  evaluation-path: ${OPA_EVALUATION_PATH:/v1/data/authz/{code}/result}
  # Maximum time to establish the connection to the OPA server, as a duration (e.g. 5s, 500ms)
  connect-timeout: ${OPA_CONNECT_TIMEOUT:5s}
  # Maximum time to wait for the response of the OPA server, as a duration (e.g. 10s, 500ms)
  read-timeout: ${OPA_READ_TIMEOUT:10s}
