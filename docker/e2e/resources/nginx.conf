server {
  listen 443 ssl;
  server_name linid.localtest.me localhost;

  absolute_redirect off;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(index\.html|config\.json)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ^~ /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Avatars uploaded through the API, served from the directory shared with it. A missing avatar
  # must answer 404 rather than fall back to index.html, so the front-end displays its generated avatar.
  # The files are user-provided: they are served without content sniffing and fully sandboxed, so an
  # image carrying a script, such as an SVG, cannot run anything when its URL is opened.
  location ^~ /avatars/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff;
      add_header Content-Security-Policy "default-src 'none'; sandbox";
  }

  location /backend/ {
    # Avatar uploads go through this proxy: keep the limit above avatar.max-size (10 MB by default).
    client_max_body_size 11m;
    proxy_pass https://api:8443/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /catalog-ui/ {
    proxy_pass http://catalog-ui/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://auth/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(static|index\.psgi)/ {
    proxy_pass http://auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
