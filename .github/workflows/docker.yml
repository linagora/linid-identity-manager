name: Docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker-build-and-publish:
    name: Build and publish ${{ matrix.image }} Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            image: linagora/linid-api
          - component: ui
            image: linagora/linid-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read OpenBao secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://obao.linagora.com
          namespace: LPS/global
          method: approle
          roleId: ${{ secrets.BAO_CLIENT_ID }}
          secretId: ${{ secrets.BAO_CLIENT_TOKEN }}
          secrets: |
            secret/data/dockerhub USERNAME | DOCKERHUB_USERNAME ;
            secret/data/dockerhub TOKEN | DOCKERHUB_TOKEN

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.ref_name }}
